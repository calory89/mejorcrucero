name: Prueba de acceso
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for u in https://www.logitravel.com/cruceros/navieras/costa-cruceros/barcos/costa-fascinosa/ https://www.logitravel.com/cruceros/navieras/msc-cruceros/barcos/msc-grandiosa/; do
            code=$(curl -s -o p.html -w "%{http_code}" -A "Mozilla/5.0 (compatible; MejorCruceroBot/1.0; +https://mejorcrucero.com)" "$u"); echo "$code $(wc -c <p.html) $u"
            echo "productos: $(grep -o '"@type":"Product"' p.html | wc -l)"; grep -o 'cruiseDate=[0-9/]*' p.html | head -3
          done
