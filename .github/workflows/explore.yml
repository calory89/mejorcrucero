name: Explorar navieras
on:
  push:
    branches: [exploracion]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  explore:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[resultados]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: NCL completo y build de prueba
        run: |
          cp src/data/sailings.json explore/merged.json
          time node tools/ncl.js explore/merged.json
          cp tools/ncl-sample.json explore/ || true
          node -e "const d=require('./explore/merged.json');const c={};d.forEach(x=>c[x.line]=(c[x.line]||0)+1);console.log(c)" | tee explore/counts.txt
          time SAILINGS=explore/merged.json BASE=/ node src/build.js | tee -a explore/counts.txt
          node test/smoke.mjs | tee -a explore/counts.txt || true
          du -sh dist dist/data/cards.json dist/salidas | tee -a explore/counts.txt
          rm explore/merged.json
      - name: Guardar resultados en la rama
        run: |
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f explore && git commit -m "Resultados de exploración [resultados]" && git push || echo "sin resultados"
