name: Explorar navieras
on:
  push:
    branches: [exploracion]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  explore:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[resultados]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: NCL_MAX=40 node tools/ncl.js explore/ncl-test.json && cp tools/ncl-sample.json explore/ || true
      - name: Guardar resultados en la rama
        run: |
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f explore && git commit -m "Resultados de exploración [resultados]" && git push || echo "sin resultados"
