name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
    - cron: '17 17 * * *'   # segunda actualización de precios   # reconstrucción diaria: tipo de cambio del BCE y, cuando exista, feed de precios
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Importar ofertas de Costa Cruceros (web oficial)
        run: |
          node tools/costa.js
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/sailings.json tools/costa-sample.json 2>/dev/null; git add src/data/sailings.json && git commit -m "Ofertas: precios de Costa actualizados" && git pull --rebase -q && git push || echo "sin cambios en ofertas"
      - name: Importar feed de precios (si está configurado)
        if: ${{ vars.FEED_URL != '' }}
        env:
          FEED_URL: ${{ vars.FEED_URL }}
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: |
          node tools/import-feed.js
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/sailings.json && git commit -m "Actualizar precios (feed diario)" && git push || echo "sin cambios"
      - name: Build
        env:
          # Con dominio propio: crear variables de repo BASE="/" y CNAME="mejorcrucero.com"
          BASE: ${{ vars.BASE || '/mejorcrucero/' }}
          CNAME: ${{ vars.CNAME }}
        run: node src/build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
