name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
    - cron: '17 17 * * *'   # segunda actualización de precios   # reconstrucción diaria: tipo de cambio del BCE y, cuando exista, feed de precios
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Importar ofertas de Costa Cruceros (web oficial)
        if: ${{ github.event_name != 'push' }}
        run: |
          node tools/costa.js
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/sailings.json; if [ -f tools/costa-sample.json ]; then git add tools/costa-sample.json; fi
          if git diff --cached --quiet; then echo "sin cambios en ofertas"; else git commit -m "Ofertas: precios de Costa actualizados" || true; fi
      - name: Importar ofertas de Norwegian Cruise Line (web oficial)
        if: ${{ github.event_name != 'push' }}
        run: |
          node tools/ncl.js
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/sailings.json; if [ -f tools/ncl-sample.json ]; then git add tools/ncl-sample.json; fi
          if git diff --cached --quiet; then echo "sin cambios en NCL"; else git commit -m "Ofertas: precios de NCL actualizados" || true; fi
      - name: Importar ofertas de Carnival (web oficial EE. UU.)
        if: ${{ github.event_name != 'push' }}
        run: |
          node tools/carnival.js
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/sailings.json; if [ -f tools/carnival-sample.json ]; then git add tools/carnival-sample.json; fi
          if git diff --cached --quiet; then echo "sin cambios en Carnival"; else git commit -m "Ofertas: precios de Carnival actualizados" || true; fi
      - name: Importar ofertas de Celestyal (web oficial, en euros)
        if: ${{ github.event_name != 'push' }}
        run: |
          node tools/celestyal.js
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/sailings.json
          if git diff --cached --quiet; then echo "sin cambios en Celestyal"; else git commit -m "Ofertas: precios de Celestyal actualizados" || true; fi
      - name: Completar fichas de barco y coordenadas de escalas (Wikipedia)
        if: ${{ github.event_name != 'push' }}
        run: |
          python3 tools/ships-wiki.py || true
          timeout 600 python3 tools/port-coords.py 60 || true
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/ships_extra.csv; if [ -f src/data/port_coords.json ]; then git add src/data/port_coords.json; fi
          if git diff --cached --quiet; then echo "sin cambios"; else git commit -m "Datos: fichas de barco y coordenadas nuevas" || true; fi
      - name: Importar feed de agencia (si está configurado)
        if: ${{ vars.FEED_URL != '' && github.event_name != 'push' }}
        env:
          FEED_URL: ${{ vars.FEED_URL }}
          FEED_PARTNER: ${{ vars.FEED_PARTNER }}
          FEED_PREFIX: ${{ vars.FEED_PREFIX }}
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: |
          node tools/import-feed.js
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/sailings.json
          if git diff --cached --quiet; then echo "sin cambios en el feed"; else git commit -m "Ofertas: feed de agencia actualizado" || true; fi
      - name: Build
        env:
          # Con dominio propio: crear variables de repo BASE="/" y CNAME="mejorcrucero.com"
          BASE: ${{ vars.BASE || '/mejorcrucero/' }}
          CNAME: ${{ vars.CNAME }}
        run: node src/build.js
      - name: Imágenes para compartir de las mejores ofertas
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install -q pillow
          python3 tools/og-offers.py || echo "sin imágenes de ofertas"
      - name: Prueba rápida del resultado
        run: node test/smoke.mjs
      - name: Publicar chollos nuevos en Telegram (apagado hasta que exista TELEGRAM_BOT_TOKEN)
        if: ${{ github.event_name != 'push' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          SITE: https://${{ vars.CNAME || 'mejorcrucero.com' }}
        run: |
          node tools/telegram.js || true
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          if [ -f src/data/telegram-posted.json ]; then git add src/data/telegram-posted.json; fi
          if git diff --cached --quiet; then echo "sin cambios"; else git commit -m "Telegram: chollos publicados" || true; fi
      - name: Guardar la foto semanal de chollos
        run: |
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/semanas; if [ -f src/data/vistas.json ]; then git add src/data/vistas.json; fi
          if git diff --cached --quiet; then echo "sin cambios"; else git commit -m "Chollos de la semana: foto actualizada" || true; fi
      - name: Subir los datos nuevos (solo si la prueba rápida ha pasado)
        run: |
          git pull --rebase -q -X theirs || { git rebase --abort; true; }
          git push || echo "no se pudo subir"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ vars.CNAME != '' }}
    steps:
      - name: Avisar a los buscadores (IndexNow) de las páginas nuevas o cambiadas
        run: |
          sleep 60
          curl -s -m 60 "https://${{ vars.CNAME }}/data/urls-hoy.txt" -o urls.txt || exit 0
          node -e "const u=require('fs').readFileSync('urls.txt','utf8').split('\n').filter(Boolean).slice(0,9000);require('fs').writeFileSync('body.json',JSON.stringify({host:process.env.H,key:process.env.K,keyLocation:'https://'+process.env.H+'/'+process.env.K+'.txt',urlList:u}));console.log(u.length,'URL')"
          curl -s -m 60 -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data @body.json || true
        env:
          H: ${{ vars.CNAME }}
          K: 2637a01b514170ca374a6377bdacb219

