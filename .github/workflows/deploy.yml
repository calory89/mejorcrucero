name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
    - cron: '17 17 * * *'   # segunda actualización de precios   # reconstrucción diaria: tipo de cambio del BCE y, cuando exista, feed de precios
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Importar ofertas de Costa Cruceros (web oficial)
        run: |
          node tools/costa.js
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/sailings.json; if [ -f tools/costa-sample.json ]; then git add tools/costa-sample.json; fi
          if git diff --cached --quiet; then echo "sin cambios en ofertas"; else git commit -m "Ofertas: precios de Costa actualizados" && git pull --rebase -q && git push || echo "no se pudo subir"; fi
      - name: Importar ofertas de Norwegian Cruise Line (web oficial)
        run: |
          node tools/ncl.js
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/sailings.json; if [ -f tools/ncl-sample.json ]; then git add tools/ncl-sample.json; fi
          if git diff --cached --quiet; then echo "sin cambios en NCL"; else git commit -m "Ofertas: precios de NCL actualizados" && git pull --rebase -q && git push || echo "no se pudo subir"; fi
      - name: Importar ofertas de Carnival (web oficial EE. UU.)
        run: |
          node tools/carnival.js
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/sailings.json; if [ -f tools/carnival-sample.json ]; then git add tools/carnival-sample.json; fi
          if git diff --cached --quiet; then echo "sin cambios en Carnival"; else git commit -m "Ofertas: precios de Carnival actualizados" && git pull --rebase -q && git push || echo "no se pudo subir"; fi
      - name: Importar feed de precios (si está configurado)
        if: ${{ vars.FEED_URL != '' }}
        env:
          FEED_URL: ${{ vars.FEED_URL }}
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: |
          node tools/import-feed.js
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/sailings.json && git commit -m "Actualizar precios (feed diario)" && git push || echo "sin cambios"
      - name: Build
        env:
          # Con dominio propio: crear variables de repo BASE="/" y CNAME="mejorcrucero.com"
          BASE: ${{ vars.BASE || '/mejorcrucero/' }}
          CNAME: ${{ vars.CNAME }}
        run: node src/build.js
      - name: Prueba rápida del resultado
        run: node test/smoke.mjs
      - name: Guardar la foto semanal de chollos
        run: |
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/semanas
          if git diff --cached --quiet; then echo "sin cambios"; else git commit -m "Chollos de la semana: foto actualizada" && git pull --rebase -q && git push || echo "no se pudo subir"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ vars.CNAME != '' }}
    steps:
      - name: Avisar a los buscadores (IndexNow) de las páginas nuevas o cambiadas
        run: |
          sleep 60
          curl -s -m 60 "https://${{ vars.CNAME }}/data/urls-hoy.txt" -o urls.txt || exit 0
          node -e "const u=require('fs').readFileSync('urls.txt','utf8').split('\n').filter(Boolean).slice(0,9000);require('fs').writeFileSync('body.json',JSON.stringify({host:process.env.H,key:process.env.K,keyLocation:'https://'+process.env.H+'/'+process.env.K+'.txt',urlList:u}));console.log(u.length,'URL')"
          curl -s -m 60 -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' --data @body.json || true
        env:
          H: ${{ vars.CNAME }}
          K: 2637a01b514170ca374a6377bdacb219

