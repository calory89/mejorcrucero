name: IDs de CruiseDirect
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'   # lunes: barcos nuevos en CruiseDirect
  push:
    branches: [main]
    paths: ['tools/cruisedirect.py']
permissions:
  contents: write
  actions: write
concurrency: cruisedirect
jobs:
  ids:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/cruisedirect.py
      - name: Guardar y republicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "mejorcrucero-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data/cruisedirect.json
          git diff --cached --quiet && { echo "sin cambios"; exit 0; }
          git commit -qm "IDs de barcos de CruiseDirect"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          gh api -X POST repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches -f ref=main
