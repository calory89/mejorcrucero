name = "mejorcrucero-api"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://mejorcrucero.com,https://www.mejorcrucero.com,https://calory89.github.io"
# Puente de email a Brevo (función de Supabase); el secreto MC_EMAIL_SECRET va como secret del Worker
MC_EMAIL_URL = "https://oykcsmextclpdnugixqz.supabase.co/functions/v1/mejorcrucero-email"

[[d1_databases]]
binding = "DB"
database_name = "mejorcrucero"
database_id = "6da3ae6e-8d15-41dd-aaba-975d21e40c5c"

[ai]
binding = "AI"

# Avisos por email: después de cada actualización de precios en GitHub (05:17 y 17:17 UTC)
[triggers]
crons = ["45 5 * * *", "45 17 * * *"]

# Fotos de las opiniones (se publican solo tras aprobarlas en /admin/)
[[r2_buckets]]
binding = "FOTOS"
bucket_name = "mejorcrucero-fotos"
